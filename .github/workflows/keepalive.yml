# Udržuje databázi Supabase vzhůru – bezplatné projekty se po týdnu bez aktivity uspí.
# Každé 3 dny pošle jeden neškodný dotaz („je tento návštěvník správce?“ → „ne“).
# Nic nečte ani nezapisuje, používá jen veřejný klíč, který je i na webu.
#
# Když databáze neodpoví správně, úloha selže a GitHub pošle e-mail
# (Settings → Notifications → Actions musí mít zapnuté e-maily).
# Ručně se dá spustit: záložka Actions → „Buzení databáze“ → Run workflow.
name: Buzení databáze

on:
  schedule:
    - cron: '17 6 */3 * *' # každé 3 dny v 6:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: write # jen pro znovuzapnutí této úlohy (viz poslední krok)

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Dotaz na databázi
        run: |
          # Adresa a veřejný klíč se berou ze stejného souboru jako na webu
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" src/data/supabase.js | head -1)
          KEY=$(grep -oE "sb_publishable_[A-Za-z0-9_-]+" src/data/supabase.js | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::V src/data/supabase.js chybí adresa nebo veřejný klíč Supabase."
            exit 1
          fi

          # Několik pokusů – krátký výpadek sítě nemá spustit poplach
          for attempt in 1 2 3 4 5; do
            BODY=$(curl -sS --max-time 30 -w '\n%{http_code}' -X POST "$URL/rest/v1/rpc/is_admin" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' || true)
            CODE=$(printf '%s' "$BODY" | tail -n1)
            RESULT=$(printf '%s' "$BODY" | head -n -1)
            if [ "$CODE" = "200" ] && [ "$RESULT" = "false" ]; then
              echo "Databáze odpověděla v pořádku (pokus $attempt)."
              exit 0
            fi
            echo "Pokus $attempt: HTTP $CODE – $RESULT"
            sleep 30
          done

          echo "::error::Databáze Supabase neodpovídá. Může být uspaná – v Supabase otevřete projekt a klikněte na Restore."
          exit 1

      - name: Kontrola webu
        run: |
          for page in "" "admin/"; do
            CODE=$(curl -sS -o /dev/null --max-time 30 --retry 3 --retry-all-errors -w '%{http_code}' "https://tanecnigit.github.io/web1/$page" || true)
            echo "/web1/$page → HTTP $CODE"
            if [ "$CODE" != "200" ]; then
              echo "::error::Web /web1/$page nevrací 200 (HTTP $CODE)."
              exit 1
            fi
          done

      # GitHub vypíná naplánované úlohy v repozitářích bez změn 60 dní.
      # Znovuzapnutí úlohy tento odpočet obnoví. Selhání tohoto kroku nevadí –
      # nejhůř přijde od GitHubu e-mail s tlačítkem pro znovuzapnutí.
      - name: Udržet úlohu zapnutou
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
